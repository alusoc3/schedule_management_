<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>先生の放課後スケジュール・行事管理</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Fonts: Inter & Noto Sans JP -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Noto Sans JP', 'sans-serif'],
          },
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Inter', 'Noto Sans JP', sans-serif;
      background-color: #0b1220;
      background-image:
        radial-gradient(ellipse 80% 60% at 50% -10%, rgba(34,211,238,0.08), transparent),
        repeating-linear-gradient(0deg, rgba(56,189,248,0.03) 0px, rgba(56,189,248,0.03) 1px, transparent 1px, transparent 32px),
        repeating-linear-gradient(90deg, rgba(56,189,248,0.03) 0px, rgba(56,189,248,0.03) 1px, transparent 1px, transparent 32px);
      background-attachment: fixed;
    }

    .type-card-会議 { border-left-color: #ef4444; }
    .type-card-行事 { border-left-color: #f59e0b; }
    .type-card-部活 { border-left-color: #10b981; }
    .type-card-資格指導 { border-left-color: #8b5cf6; }
    .type-card-その他 { border-left-color: #64748b; }

    .past-task {
      opacity: 0.6;
      background-color: #17223a !important;
    }

    .tech-header {
      background-color: #050810;
      background-image:
        linear-gradient(120deg, rgba(34,211,238,0.10) 0%, transparent 45%),
        repeating-linear-gradient(0deg, rgba(56,189,248,0.07) 0px, rgba(56,189,248,0.07) 1px, transparent 1px, transparent 26px),
        repeating-linear-gradient(90deg, rgba(56,189,248,0.07) 0px, rgba(56,189,248,0.07) 1px, transparent 1px, transparent 26px);
      position: relative;
    }
    .tech-header::after {
      content: '';
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #22d3ee 50%, transparent);
      opacity: 0.7;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0b1220;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 9999px;
    }
    /* 編集中の予定カードの強調表示 */
    .editing-task {
      background-color: rgba(217, 70, 239, 0.18) !important;
      box-shadow: 0 0 0 2px #e879f9, 0 0 18px rgba(232, 121, 249, 0.35) !important;
    }
  </style>
</head>
<body class="min-h-screen text-slate-200 antialiased p-3 sm:p-6 md:p-8 flex justify-center items-start text-base">

  <div class="w-full max-w-4xl bg-[#131c30] rounded-2xl shadow-2xl shadow-cyan-500/5 border border-cyan-500/15 overflow-hidden my-auto">
    
    <!-- トップヘッダーバナー -->
    <header class="tech-header text-white p-5 sm:p-7 relative overflow-hidden">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 relative z-10">
        <div>
          <div class="inline-flex items-center gap-2 bg-cyan-400/10 border border-cyan-400/30 backdrop-blur-md px-3.5 py-1 rounded-full text-sm font-semibold tracking-wide text-cyan-300 mb-2">
            <i class="fa-solid fa-bolt text-cyan-300"></i> 校内情報共有ダッシュボード
          </div>
          <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-white" style="text-shadow: 0 0 20px rgba(34,211,238,0.4);">放課後スケジュール・行事管理</h1>
          <p class="text-cyan-100/80 text-xs sm:text-sm mt-1.5 tracking-[0.15em] uppercase">Schedule &amp; Event Management</p>
        </div>
        
        <!-- リアルタイム集計カウンター -->
        <div class="flex items-center gap-2 self-start sm:self-center">
          <div class="bg-white/5 backdrop-blur-sm border border-cyan-400/20 px-4 py-2.5 rounded-xl text-center min-w-[85px]">
            <span class="block text-xs text-white font-semibold">全予定</span>
            <span id="statTotalCount" class="text-2xl font-bold text-white">0</span>
          </div>
          <div class="bg-white/5 backdrop-blur-sm border border-cyan-400/20 px-4 py-2.5 rounded-xl text-center min-w-[85px]">
            <span class="block text-xs text-white font-semibold">本日の予定</span>
            <span id="statTodayCount" class="text-2xl font-bold text-amber-300">0</span>
          </div>
          <div class="bg-white/5 backdrop-blur-sm border border-cyan-400/20 px-4 py-2.5 rounded-xl text-center min-w-[85px]">
            <span class="block text-xs text-white font-semibold">終了した予定</span>
            <span id="statPastCount" class="text-2xl font-bold text-slate-300">0</span>
          </div>
        </div>
      </div>
    </header>

    <main class="p-4 sm:p-6 md:p-8 space-y-6">

      <!-- スケジュール登録フォーム -->
      <section class="bg-slate-700/40 border border-cyan-500/15 rounded-2xl p-5 sm:p-7 shadow-sm relative">
        <h2 class="text-lg font-bold text-white flex items-center gap-2.5 mb-5">
          <span class="w-8 h-8 rounded-lg bg-cyan-500/10 text-cyan-400 flex items-center justify-center text-base">
            <i id="formTitleIcon" class="fa-solid fa-calendar-plus"></i>
          </span>
          <span id="formTitleText">新しいスケジュールを追加</span>
        </h2>

        <form id="scheduleForm" onsubmit="handleFormSubmit(event)" class="space-y-5">
          <!-- 行 1: 担当者 & 種別 -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label for="teacherSelect" class="block text-sm font-bold text-white mb-1.5">
                担当（先生の名前） <span class="text-red-400">*</span>
              </label>
              <div class="relative">
                <select id="teacherSelect" required class="w-full bg-slate-900/70 border border-slate-700 text-white text-base rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 appearance-none transition-all">
                  <option value="">名前を選択...</option>
                  <option value="小松先生">小松先生</option>
                  <option value="中塚先生">中塚先生</option>
                  <option value="塩沢誉先生">塩沢誉先生</option>
                  <option value="塩澤仁士先生">塩澤仁士先生</option>
                  <option value="福澤先生">福澤先生</option>
                  <option value="丸山先生">丸山先生</option>
                  <option value="清水先生">清水先生</option>
                </select>
                <i class="fa-solid fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none text-sm"></i>
              </div>
            </div>

            <div>
              <label for="typeSelect" class="block text-sm font-bold text-white mb-1.5">
                種別 <span class="text-red-400">*</span>
              </label>
              <div class="relative">
                <select id="typeSelect" required onchange="updateTaskRequired()" class="w-full bg-slate-900/70 border border-slate-700 text-white text-base rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 appearance-none transition-all">
                  <option value="会議">会議</option>
                  <option value="行事">行事</option>
                  <option value="部活">部活</option>
                  <option value="資格指導">資格指導</option>
                  <option value="その他">その他</option>
                </select>
                <i class="fa-solid fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none text-sm"></i>
              </div>
            </div>
          </div>

          <!-- 行 2: 日付 & 時間（開始時間・終了時間を必須化） -->
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div>
              <label for="dateInput" class="block text-sm font-bold text-white mb-1.5">
                日付 <span class="text-red-400">*</span>
              </label>
              <input type="date" id="dateInput" required class="w-full bg-slate-900/70 border border-slate-700 text-white text-base rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 transition-all">
            </div>

            <div>
              <label for="timeInput" class="block text-sm font-bold text-white mb-1.5">
                開始時間 <span class="text-red-400">*</span>
              </label>
              <input type="time" id="timeInput" required class="w-full bg-slate-900/70 border border-slate-700 text-white text-base rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 transition-all">
            </div>

            <div>
              <label for="endTimeInput" class="block text-sm font-bold text-white mb-1.5">
                終了時間 <span class="text-red-400">*</span>
              </label>
              <input type="time" id="endTimeInput" required class="w-full bg-slate-900/70 border border-slate-700 text-white text-base rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 transition-all">
            </div>
          </div>

          <!-- 行 3: 予定・内容 -->
          <div>
            <label for="taskInput" class="block text-sm font-bold text-white mb-1.5">
              予定・内容 <span id="taskRequiredMark" class="text-slate-300 font-normal">(任意)</span>
            </label>
            <textarea id="taskInput" rows="3" placeholder="例：学年会議、保護者会準備、サッカー部練習指導 など&#10;（Enterキーで改行できます）" class="w-full bg-slate-900/70 border border-slate-700 text-white text-base rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 transition-all resize-y"></textarea>
          </div>

          <!-- 送信ボタン & 編集キャンセルボタン -->
          <div class="flex gap-3 pt-1">
            <button type="submit" class="flex-1 bg-cyan-600 hover:bg-cyan-500 active:bg-cyan-700 text-white font-semibold py-3.5 px-5 rounded-xl shadow-md shadow-cyan-900/30 hover:shadow-lg transition-all duration-200 flex items-center justify-center gap-2 text-base">
              <i id="submitBtnIcon" class="fa-solid fa-plus"></i> <span id="submitBtnText">スケジュールを追加</span>
            </button>
            <button type="button" id="cancelEditBtn" onclick="cancelEdit()" class="hidden px-6 py-3.5 bg-slate-800 hover:bg-slate-700 text-white font-semibold rounded-xl border border-slate-700 transition-all text-base">
              キャンセル
            </button>
          </div>
        </form>
      </section>

      <!-- 担当者フィルタータブ -->
      <section class="space-y-3">
        <div class="flex items-center justify-between">
          <h2 class="text-sm font-bold text-white uppercase tracking-wider flex items-center gap-2">
            <i class="fa-solid fa-user-gear text-cyan-400"></i> 担当の先生で絞り込み（複数選択可）
          </h2>
          <span id="currentTeacherLabel" class="text-sm font-semibold text-cyan-400">表示中: 全員</span>
        </div>

        <!-- 横スクロール可能な先生選択タブ -->
        <div class="flex items-center gap-2.5 overflow-x-auto pb-2 pt-1 no-scrollbar -mx-1 px-1">
          <button type="button" onclick="toggleTeacherTab('ALL')" id="tab-ALL" class="teacher-tab px-4 py-2.5 rounded-xl text-sm font-bold whitespace-nowrap transition-all shadow-sm bg-cyan-600 text-white ring-2 ring-cyan-400/60">
            👥 全員
          </button>

          <button type="button" onclick="toggleTeacherTab('小松先生')" id="tab-小松先生" class="teacher-tab px-4 py-2.5 rounded-xl text-sm font-semibold whitespace-nowrap bg-slate-800/60 text-white border border-slate-700 hover:bg-slate-700/60 transition-all">
            小松先生
          </button>
          <button type="button" onclick="toggleTeacherTab('中塚先生')" id="tab-中塚先生" class="teacher-tab px-4 py-2.5 rounded-xl text-sm font-semibold whitespace-nowrap bg-slate-800/60 text-white border border-slate-700 hover:bg-slate-700/60 transition-all">
            中塚先生
          </button>
          <button type="button" onclick="toggleTeacherTab('塩沢誉先生')" id="tab-塩沢誉先生" class="teacher-tab px-4 py-2.5 rounded-xl text-sm font-semibold whitespace-nowrap bg-slate-800/60 text-white border border-slate-700 hover:bg-slate-700/60 transition-all">
            塩沢誉先生
          </button>
          <button type="button" onclick="toggleTeacherTab('塩澤仁士先生')" id="tab-塩澤仁士先生" class="teacher-tab px-4 py-2.5 rounded-xl text-sm font-semibold whitespace-nowrap bg-slate-800/60 text-white border border-slate-700 hover:bg-slate-700/60 transition-all">
            塩澤仁士先生
          </button>
          <button type="button" onclick="toggleTeacherTab('福澤先生')" id="tab-福澤先生" class="teacher-tab px-4 py-2.5 rounded-xl text-sm font-semibold whitespace-nowrap bg-slate-800/60 text-white border border-slate-700 hover:bg-slate-700/60 transition-all">
            福澤先生
          </button>
          <button type="button" onclick="toggleTeacherTab('丸山先生')" id="tab-丸山先生" class="teacher-tab px-4 py-2.5 rounded-xl text-sm font-semibold whitespace-nowrap bg-slate-800/60 text-white border border-slate-700 hover:bg-slate-700/60 transition-all">
            丸山先生
          </button>
          <button type="button" onclick="toggleTeacherTab('清水先生')" id="tab-清水先生" class="teacher-tab px-4 py-2.5 rounded-xl text-sm font-semibold whitespace-nowrap bg-slate-800/60 text-white border border-slate-700 hover:bg-slate-700/60 transition-all">
            清水先生
          </button>
        </div>
      </section>

      <!-- カテゴリフィルター & アクションコントロール -->
      <section class="flex flex-wrap items-center justify-between gap-3 bg-slate-700/40 p-3.5 rounded-xl border border-slate-600/50">
        <!-- 種別フィルター -->
        <div class="flex items-center gap-2.5">
          <span class="text-sm font-bold text-white whitespace-nowrap">種別:</span>
          <div class="relative">
            <select id="filterType" onchange="renderSchedule()" class="bg-slate-900/70 border border-slate-700 text-white text-sm rounded-lg pl-3.5 pr-8 py-2 focus:outline-none focus:ring-2 focus:ring-cyan-500 appearance-none">
              <option value="ALL">すべての種別</option>
              <option value="会議">会議</option>
              <option value="行事">行事</option>
              <option value="部活">部活</option>
              <option value="資格指導">資格指導</option>
              <option value="その他">その他</option>
            </select>
            <i class="fa-solid fa-chevron-down absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none text-xs"></i>
          </div>
        </div>

        <!-- 過去予定の一括削除ボタン -->
        <button onclick="requestDeletePastTasks()" class="px-3.5 py-2 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 rounded-lg text-sm font-bold transition-all flex items-center gap-2 shadow-sm">
          <i class="fa-solid fa-broom text-rose-400"></i> 終了した予定を一括削除
        </button>
      </section>

      <!-- 進行中・本日の予定一覧セクション -->
      <section class="space-y-3">
        <div class="flex items-center justify-between px-1">
          <h2 class="text-lg font-bold text-white flex items-center gap-2">
            <i class="fa-solid fa-calendar-day text-cyan-400"></i> 今後の予定・本日の予定
          </h2>
          <span id="upcomingCountText" class="text-sm text-slate-300">0 件</span>
        </div>

        <ul id="upcomingTaskList" class="space-y-3 min-h-[60px]">
          <!-- JavaScriptによって動的に予定カードが挿入されます -->
        </ul>
      </section>

      <!-- 終了した予定一覧セクション -->
      <section class="space-y-3 pt-4 border-t border-slate-700/50">
        <details class="group bg-slate-700/30 border border-slate-600/50 rounded-2xl p-4 transition-all" open>
          <summary class="flex items-center justify-between font-bold text-white cursor-pointer select-none list-none">
            <div class="flex items-center gap-2 text-base sm:text-lg">
              <i class="fa-solid fa-circle-check text-slate-400 group-open:text-cyan-400 transition-colors"></i>
              <span>終了した予定（期限切れ）</span>
              <span id="pastCountText" class="text-xs bg-slate-700/60 text-white px-2.5 py-0.5 rounded-full ml-1">0 件</span>
            </div>
            <i class="fa-solid fa-chevron-down text-slate-400 text-sm group-open:rotate-180 transition-transform duration-200"></i>
          </summary>

          <ul id="pastTaskList" class="space-y-3 mt-4">
            <!-- JavaScriptによって動的に終了済みの予定カードが挿入されます -->
          </ul>
        </details>
      </section>

    </main>

    <!-- フッター -->
    <footer class="bg-slate-900/60 border-t border-slate-700/50 px-6 py-4 text-center text-xs text-slate-400">
      <p>先生の放課後スケジュール・行事管理システム &copy; 校内連携・校務効率化</p>
    </footer>
  </div>

  <!-- カスタム確認ダイアログ（モーダル） -->
  <div id="customModal" class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-200 p-4">
    <div class="bg-[#0b1220] border border-slate-700 rounded-2xl max-w-sm w-full p-6 shadow-2xl transform scale-95 transition-transform duration-200" id="modalCard">
      <div id="modalIconContainer" class="w-12 h-12 rounded-full bg-red-500/10 text-red-400 flex items-center justify-center mx-auto mb-4 text-2xl">
        <i class="fa-solid fa-triangle-exclamation"></i>
      </div>
      <h3 id="modalTitle" class="text-xl font-bold text-white text-center mb-2">削除の確認</h3>
      <p id="modalMessage" class="text-base text-slate-300 text-center mb-6">この処理を実行しますか？</p>
      <div class="flex gap-3">
        <button onclick="closeModal()" class="flex-1 py-3 px-4 bg-slate-800 hover:bg-slate-700 text-white text-base font-semibold rounded-xl transition-colors">
          キャンセル
        </button>
        <button id="modalConfirmBtn" class="flex-1 py-3 px-4 bg-red-600 hover:bg-red-700 text-white text-base font-semibold rounded-xl shadow-md transition-colors">
          実行する
        </button>
      </div>
    </div>
  </div>

  <!-- Firebase SDK の読み込み -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCn9ynoMkceF_4oucSsuyJk2MR63rXoL78",
      authDomain: "school-schedule-8806e.firebaseapp.com",
      databaseURL: "https://school-schedule-8806e-default-rtdb.firebaseio.com",
      projectId: "school-schedule-8806e",
      storageBucket: "school-schedule-8806e.firebasestorage.app",
      messagingSenderId: "520405731274",
      appId: "1:520405731274:web:1c7f98a459bdce3dbab133"
    };

    let db = null;
    let tasksRef = null;
    let isFirebaseConnected = false;

    let tasks = [];
    let selectedTeachers = ['ALL'];
    let modalActionType = null;
    let deleteTargetId = null;
    let editingTaskId = null;
    let pendingDuplicateId = null;

    const teacherList = ["小松先生", "中塚先生", "塩沢誉先生", "塩澤仁士先生", "福澤先生", "丸山先生", "清水先生"];

    document.addEventListener("DOMContentLoaded", () => {
      const todayStr = getTodayFormatted();
      document.getElementById("dateInput").value = todayStr;

      updateTaskRequired();

      try {
        if (typeof firebase !== 'undefined') {
          firebase.initializeApp(firebaseConfig);
          db = firebase.database();
          tasksRef = db.ref("tasks");
          
          tasksRef.on("value", (snapshot) => {
            isFirebaseConnected = true;
            const data = snapshot.val();
            tasks = data ? Object.keys(data).map(key => ({ id: key, ...data[key] })) : [];
            renderSchedule();
          }, (error) => {
            console.warn("Firebase offline or permission error, falling back to LocalStorage:", error);
            initLocalStorageFallback();
          });
        } else {
          initLocalStorageFallback();
        }
      } catch (e) {
        console.warn("Firebase init failed, fallback to LocalStorage:", e);
        initLocalStorageFallback();
      }
    });

    function updateTaskRequired() {
      const typeSelect = document.getElementById("typeSelect");
      const taskInput = document.getElementById("taskInput");
      const mark = document.getElementById("taskRequiredMark");

      if (typeSelect.value === "その他") {
        taskInput.required = true;
        mark.className = "text-red-400 font-bold";
        mark.textContent = "*";
      } else {
        taskInput.required = false;
        mark.className = "text-slate-300 font-normal";
        mark.textContent = "(任意)";
      }
    }

    function initLocalStorageFallback() {
      isFirebaseConnected = false;
      const cached = localStorage.getItem("teacher_schedules_v2");
      if (cached) {
        try {
          tasks = JSON.parse(cached);
        } catch(e) {
          tasks = getSampleData();
        }
      } else {
        tasks = getSampleData();
        saveTasksToStorage();
      }
      renderSchedule();
    }

    function saveTasksToStorage() {
      if (!isFirebaseConnected) {
        localStorage.setItem("teacher_schedules_v2", JSON.stringify(tasks));
      }
    }

    function getTodayFormatted() {
      const today = new Date();
      return today.toISOString().split('T')[0];
    }

    function getSampleData() {
      const todayStr = getTodayFormatted();
      const yesterday = new Date();
      yesterday.setDate(yesterday.getDate() - 1);
      const yesterdayStr = yesterday.toISOString().split('T')[0];

      const tomorrow = new Date();
      tomorrow.setDate(tomorrow.getDate() + 1);
      const tomorrowStr = tomorrow.toISOString().split('T')[0];

      return [
        {
          id: "task_sample_1",
          teacher: "小松先生",
          type: "会議",
          date: yesterdayStr,
          time: "15:30",
          endTime: "16:30",
          text: "第2回 校内研修準備会"
        },
        {
          id: "task_sample_2",
          teacher: "塩沢誉先生",
          type: "部活",
          date: todayStr,
          time: "16:00",
          endTime: "18:00",
          text: "サッカー部 グラウンド技術指導"
        },
        {
          id: "task_sample_3",
          teacher: "中塚先生",
          type: "行事",
          date: tomorrowStr,
          time: "10:00",
          endTime: "12:00",
          text: "生徒会選挙 リハーサル進行"
        }
      ];
    }

    function toggleTeacherTab(teacherName) {
      if (teacherName === 'ALL') {
        selectedTeachers = ['ALL'];
      } else {
        if (selectedTeachers.includes('ALL')) selectedTeachers = [];

        if (selectedTeachers.includes(teacherName)) {
          selectedTeachers = selectedTeachers.filter(t => t !== teacherName);
        } else {
          selectedTeachers.push(teacherName);
        }

        if (selectedTeachers.length === 0 || selectedTeachers.length === teacherList.length) {
          selectedTeachers = ['ALL'];
        }
      }

      updateTeacherTabUI();
      renderSchedule();
    }

    function updateTeacherTabUI() {
      const activeClass = "teacher-tab px-4 py-2.5 rounded-xl text-sm font-bold whitespace-nowrap transition-all shadow-sm bg-cyan-600 text-white ring-2 ring-cyan-400/60";
      const inactiveClass = "teacher-tab px-4 py-2.5 rounded-xl text-sm font-semibold whitespace-nowrap bg-slate-800/60 text-white border border-slate-700 hover:bg-slate-700/60 transition-all";

      document.getElementById('tab-ALL').className = selectedTeachers.includes('ALL') ? activeClass : inactiveClass;

      teacherList.forEach(t => {
        const btn = document.getElementById(`tab-${t}`);
        if (btn) {
          btn.className = selectedTeachers.includes(t) && !selectedTeachers.includes('ALL') ? activeClass : inactiveClass;
        }
      });

      const label = document.getElementById("currentTeacherLabel");
      label.textContent = selectedTeachers.includes('ALL') ? "表示中: 全員" : `表示中: ${selectedTeachers.join('・')}`;
    }

    function handleFormSubmit(event) {
      event.preventDefault();

      const teacher = document.getElementById("teacherSelect").value;
      const type = document.getElementById("typeSelect").value;
      const date = document.getElementById("dateInput").value;
      const time = document.getElementById("timeInput").value;
      const endTime = document.getElementById("endTimeInput").value;
      const text = document.getElementById("taskInput").value.trim();

      // 開始時間・終了時間を必須としてチェック
      if (!teacher || !date || !time || !endTime) return;
      if (type === "その他" && !text) return;

      const taskData = { teacher, type, date, time, endTime, text };

      if (editingTaskId) {
        if (isFirebaseConnected && db) {
          db.ref("tasks/" + editingTaskId).update(taskData);
        } else {
          const idx = tasks.findIndex(t => t.id === editingTaskId);
          if (idx !== -1) {
            tasks[idx] = { ...tasks[idx], ...taskData };
          }
          saveTasksToStorage();
          renderSchedule();
        }
        pendingDuplicateId = null;
        cancelEdit();
        return;
      }

      const newTask = taskData;

      if (isFirebaseConnected && tasksRef) {
        tasksRef.push(newTask);
      } else {
        newTask.id = "task_" + Date.now();
        tasks.push(newTask);
        saveTasksToStorage();
        renderSchedule();
      }

      document.getElementById("taskInput").value = "";
      document.getElementById("timeInput").value = "";
      document.getElementById("endTimeInput").value = "";
    }

    function startEditTask(id) {
      const task = tasks.find(t => t.id === id);
      if (!task) return;

      // 未確定の複製が残っていて別の予定を編集する場合は、その複製を削除
      if (pendingDuplicateId && pendingDuplicateId !== id) {
        removeTaskById(pendingDuplicateId);
        pendingDuplicateId = null;
      }

      editingTaskId = id;

      document.getElementById("teacherSelect").value = task.teacher;
      document.getElementById("typeSelect").value = task.type;
      document.getElementById("dateInput").value = task.date;
      document.getElementById("timeInput").value = task.time || "";
      document.getElementById("endTimeInput").value = task.endTime || "";
      document.getElementById("taskInput").value = (task.text || "").trim();

      updateTaskRequired();

      document.getElementById("formTitleText").textContent = "予定を編集";
      document.getElementById("formTitleIcon").className = "fa-solid fa-pen";
      document.getElementById("submitBtnIcon").className = "fa-solid fa-check";
      document.getElementById("submitBtnText").textContent = "変更を保存";
      document.getElementById("cancelEditBtn").classList.remove("hidden");

      renderSchedule();

      document.getElementById("scheduleForm").scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function cancelEdit() {
      // 複製直後の編集をキャンセルした場合は、複製した予定を削除
      if (pendingDuplicateId && editingTaskId === pendingDuplicateId) {
        removeTaskById(pendingDuplicateId);
      }
      pendingDuplicateId = null;
      editingTaskId = null;

      document.getElementById("scheduleForm").reset();
      document.getElementById("dateInput").value = getTodayFormatted();

      updateTaskRequired();

      document.getElementById("formTitleText").textContent = "新しいスケジュールを追加";
      document.getElementById("formTitleIcon").className = "fa-solid fa-calendar-plus";
      document.getElementById("submitBtnIcon").className = "fa-solid fa-plus";
      document.getElementById("submitBtnText").textContent = "スケジュールを追加";
      document.getElementById("cancelEditBtn").classList.add("hidden");

      renderSchedule();
    }

    function removeTaskById(id) {
      if (isFirebaseConnected && db) {
        db.ref("tasks/" + id).remove();
      } else {
        tasks = tasks.filter(t => t.id !== id);
        saveTasksToStorage();
        renderSchedule();
      }
    }

    function duplicateTask(id) {
      const task = tasks.find(t => t.id === id);
      if (!task) return;

      // 前回の未確定の複製が残っていれば削除
      if (pendingDuplicateId) {
        removeTaskById(pendingDuplicateId);
        pendingDuplicateId = null;
      }

      const copyData = {
        teacher: task.teacher,
        type: task.type,
        date: task.date,
        time: task.time || "",
        endTime: task.endTime || "",
        text: task.text || ""
      };

      let newId;
      if (isFirebaseConnected && tasksRef) {
        newId = tasksRef.push(copyData).key;
      } else {
        newId = "task_" + Date.now();
        copyData.id = newId;
        tasks.push(copyData);
        saveTasksToStorage();
        renderSchedule();
      }

      // 複製した予定をそのまま編集フォームで開く（キャンセルされたら削除する）
      pendingDuplicateId = newId;
      if (tasks.some(t => t.id === newId)) {
        startEditTask(newId);
      } else {
        // Firebaseからの反映待ち
        setTimeout(() => startEditTask(newId), 300);
      }
    }

    function requestDeleteTask(id) {
      modalActionType = 'delete_single';
      deleteTargetId = id;

      showModal({
        title: "予定の削除",
        message: "この予定を削除してもよろしいですか？",
        confirmText: "削除する",
        isDanger: true
      });
    }

    function requestDeletePastTasks() {
      const todayStr = getTodayFormatted();
      const pastCount = tasks.filter(t => t.date < todayStr).length;

      if (pastCount === 0) {
        showModal({
          title: "終了した予定はありません",
          message: "削除対象となる過去の日付の予定はありませんでした。",
          confirmText: "確認",
          isDanger: false,
          hideCancel: true
        });
        return;
      }

      modalActionType = 'delete_past';
      showModal({
        title: "終了した予定を一括削除",
        message: `本日より前の終了した予定（計 ${pastCount} 件）を一括削除しますか？`,
        confirmText: `${pastCount} 件を削除`,
        isDanger: true
      });
    }

    function showModal({ title, message, confirmText, isDanger, hideCancel }) {
      const modal = document.getElementById("customModal");
      const card = document.getElementById("modalCard");
      
      document.getElementById("modalTitle").textContent = title;
      document.getElementById("modalMessage").textContent = message;
      
      const confirmBtn = document.getElementById("modalConfirmBtn");
      confirmBtn.textContent = confirmText;

      confirmBtn.className = isDanger
        ? "flex-1 py-3 px-4 bg-red-600 hover:bg-red-700 text-white text-base font-semibold rounded-xl shadow-md transition-colors"
        : "flex-1 py-3 px-4 bg-cyan-600 hover:bg-cyan-500 text-white text-base font-semibold rounded-xl shadow-md transition-colors";

      modal.classList.remove("hidden");
      setTimeout(() => {
        modal.classList.remove("opacity-0");
        card.classList.remove("scale-95");
        card.classList.add("scale-100");
      }, 10);

      confirmBtn.onclick = () => {
        if (modalActionType === 'delete_single') {
          executeDeleteSingle();
        } else if (modalActionType === 'delete_past') {
          executeDeletePast();
        } else {
          closeModal();
        }
      };
    }

    function closeModal() {
      const modal = document.getElementById("customModal");
      const card = document.getElementById("modalCard");

      modal.classList.add("opacity-0");
      card.classList.remove("scale-100");
      card.classList.add("scale-95");

      setTimeout(() => {
        modal.classList.add("hidden");
        deleteTargetId = null;
        modalActionType = null;
      }, 200);
    }

    function executeDeleteSingle() {
      if (!deleteTargetId) return;

      if (isFirebaseConnected && db) {
        db.ref("tasks/" + deleteTargetId).remove();
      } else {
        tasks = tasks.filter(t => t.id !== deleteTargetId);
        saveTasksToStorage();
        renderSchedule();
      }
      closeModal();
    }

    function executeDeletePast() {
      const todayStr = getTodayFormatted();

      if (isFirebaseConnected && db) {
        db.ref("tasks").once("value", (snapshot) => {
          const data = snapshot.val();
          if (data) {
            const updates = {};
            Object.keys(data).forEach(key => {
              if (data[key].date < todayStr) {
                updates[key] = null;
              }
            });
            db.ref("tasks").update(updates);
          }
        });
      } else {
        tasks = tasks.filter(t => t.date >= todayStr);
        saveTasksToStorage();
        renderSchedule();
      }
      closeModal();
    }

    function renderSchedule() {
      const upcomingList = document.getElementById("upcomingTaskList");
      const pastList = document.getElementById("pastTaskList");
      const filterType = document.getElementById("filterType").value;
      const todayStr = getTodayFormatted();

      upcomingList.innerHTML = "";
      pastList.innerHTML = "";

      let filtered = tasks.filter(task => {
        const matchTeacher = selectedTeachers.includes('ALL') || selectedTeachers.includes(task.teacher);
        const matchType = filterType === 'ALL' || task.type === filterType;
        return matchTeacher && matchType;
      });

      filtered.sort((a, b) => {
        // 編集中の予定は常に一番上に表示
        if (a.id === editingTaskId && b.id !== editingTaskId) return -1;
        if (b.id === editingTaskId && a.id !== editingTaskId) return 1;
        if (a.date !== b.date) return a.date.localeCompare(b.date);
        return (a.time || "").localeCompare(b.time || "");
      });

      let upcomingCount = 0;
      let pastCount = 0;
      let todayCount = 0;

      filtered.forEach(task => {
        const isPast = task.date < todayStr;
        const isToday = task.date === todayStr;

        if (isToday) todayCount++;

        const card = createTaskCardElement(task, isPast, isToday);

        if (isPast) {
          pastCount++;
          pastList.appendChild(card);
        } else {
          upcomingCount++;
          upcomingList.appendChild(card);
        }
      });

      if (upcomingCount === 0) {
        upcomingList.innerHTML = `
          <li class="bg-slate-800/40 border border-slate-700/60 rounded-xl p-8 text-center text-slate-300">
            <i class="fa-solid fa-calendar-check text-3xl mb-2 text-slate-400"></i>
            <p class="text-base font-medium text-white">該当する今後の予定はありません</p>
          </li>
        `;
      }

      if (pastCount === 0) {
        pastList.innerHTML = `
          <li class="text-center py-4 text-sm text-slate-400">
            終了した予定はありません
          </li>
        `;
      }

      document.getElementById("statTotalCount").textContent = tasks.length;
      document.getElementById("statTodayCount").textContent = tasks.filter(t => t.date === todayStr).length;
      document.getElementById("statPastCount").textContent = tasks.filter(t => t.date < todayStr).length;

      document.getElementById("upcomingCountText").textContent = `${upcomingCount} 件`;
      document.getElementById("pastCountText").textContent = `${pastCount} 件`;
    }

    function createTaskCardElement(task, isPast, isToday) {
      const li = document.createElement("li");
      
      const baseClass = "bg-slate-800/80 hover:bg-slate-800 border-l-4 border-y border-r border-slate-700/80 rounded-xl p-4 transition-all duration-200 shadow-md relative group flex flex-col sm:flex-row sm:items-center justify-between gap-4";
      const typeClass = `type-card-${task.type || 'その他'}`;
      const statusClass = isPast ? "past-task" : "";
      const todayRingClass = isToday ? "ring-1 ring-amber-400/40 bg-amber-500/5" : "";

      const isEditing = task.id === editingTaskId;
      li.className = `${baseClass} ${typeClass} ${statusClass} ${todayRingClass} ${isEditing ? 'editing-task' : ''}`;

      const badgeColors = {
        "会議": "bg-red-500/20 text-red-300 border-red-500/30",
        "行事": "bg-amber-500/20 text-amber-300 border-amber-500/30",
        "部活": "bg-emerald-500/20 text-emerald-300 border-emerald-500/30",
        "資格指導": "bg-violet-500/20 text-violet-300 border-violet-500/30",
        "その他": "bg-slate-600/30 text-slate-300 border-slate-500/30"
      };
      const badgeStyle = badgeColors[task.type] || badgeColors["その他"];

      let timeText = "";
      if (task.time && task.endTime) {
        timeText = `${task.time} 〜 ${task.endTime}`;
      } else if (task.time) {
        timeText = `${task.time} 〜`;
      } else {
        timeText = "終日 / 整理時間未定";
      }

      const formattedText = task.text ? escapeHtml(task.text).replace(/\n/g, "<br>") : "";

      li.innerHTML = `
        <div class="space-y-2 flex-1 min-w-0">
          <div class="flex items-center flex-wrap gap-2">
            <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-lg text-sm font-bold bg-cyan-500/10 text-cyan-300 border border-cyan-500/20">
              <i class="fa-solid fa-user-tier text-xs"></i> ${escapeHtml(task.teacher)}
            </span>
            <span class="inline-flex items-center px-2.5 py-1 rounded-lg text-xs font-semibold border ${badgeStyle}">
              ${escapeHtml(task.type)}
            </span>
            ${isEditing ? `<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg text-xs font-bold bg-fuchsia-500 text-white"><i class="fa-solid fa-pen"></i> 編集中</span>` : ''}
            ${isToday ? `<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg text-xs font-bold bg-amber-400/20 text-amber-300 border border-amber-400/40 animate-pulse"><i class="fa-solid fa-clock"></i> 本日</span>` : ''}
          </div>

          <div class="flex items-center gap-4 text-white text-sm font-medium">
            <span class="flex items-center gap-1.5">
              <i class="fa-regular fa-calendar text-cyan-400"></i> ${escapeHtml(task.date)}
            </span>
            <span class="flex items-center gap-1.5 text-slate-300">
              <i class="fa-regular fa-clock text-slate-400"></i> ${escapeHtml(timeText)}
            </span>
          </div>

          ${formattedText ? `
            <div class="text-white text-base font-normal pt-1 break-words leading-relaxed">
              ${formattedText}
            </div>
          ` : ''}
        </div>

        <div class="flex items-center gap-2 self-end sm:self-center pt-2 sm:pt-0 border-t sm:border-t-0 border-slate-700/50 w-full sm:w-auto justify-end">
          <button onclick="startEditTask('${task.id}')" title="編集" class="p-2.5 text-slate-300 hover:text-cyan-300 hover:bg-slate-700/60 rounded-lg transition-colors">
            <i class="fa-solid fa-pen text-base"></i>
          </button>
          ${isPast ? '' : `
          <button onclick="duplicateTask('${task.id}')" title="複製" class="p-2.5 text-slate-300 hover:text-cyan-300 hover:bg-slate-700/60 rounded-lg transition-colors">
            <i class="fa-regular fa-copy text-base"></i>
          </button>
          `}
          <button onclick="requestDeleteTask('${task.id}')" title="削除" class="p-2.5 text-slate-300 hover:text-rose-400 hover:bg-slate-700/60 rounded-lg transition-colors">
            <i class="fa-solid fa-trash-can text-base"></i>
          </button>
        </div>
      `;

      return li;
    }

    function escapeHtml(str) {
      if (!str) return "";
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
